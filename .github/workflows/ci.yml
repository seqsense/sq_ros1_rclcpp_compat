name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: noetic
            ros_version: ros1
            ros1_distro: noetic
            ros2_distro: jazzy
          - distro: one
            ros_version: ros1
            ros1_distro: one
            ros2_distro: jazzy
          - distro: humble
            ros_version: ros2
            ros1_distro: noetic
            ros2_distro: humble
          - distro: jazzy
            ros_version: ros2
            ros1_distro: noetic
            ros2_distro: jazzy

    name: ${{ matrix.distro }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create workspace symlinks
        run: |
          mkdir -p workspace/src ros2_workspace/src
          cd workspace/src
          ln -s ../../sq_ros1_rclcpp_compat sq_ros1_rclcpp_compat
          for pkg in hybrid_imu_analyzer hybrid_package_msgs hybrid_package_pubsub_samples; do
            ln -s ../../samples/$pkg $pkg
          done
          cd "$GITHUB_WORKSPACE/ros2_workspace/src"
          for pkg in sq_ros1_rclcpp_compat hybrid_imu_analyzer hybrid_package_msgs hybrid_package_pubsub_samples; do
            ln -s ../../workspace/src/$pkg $pkg
          done

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/${{ matrix.ros_version }}/Dockerfile
          build-args: |
            ROS1_DISTRO=${{ matrix.ros1_distro }}
            ROS2_DISTRO=${{ matrix.ros2_distro }}
            USER_UID=1001
            USER_GID=1001
          tags: ros-ci:${{ matrix.distro }}
          load: true
          cache-from: type=gha,scope=${{ matrix.ros_version }}-${{ matrix.distro }}
          cache-to: type=gha,scope=${{ matrix.ros_version }}-${{ matrix.distro }},mode=max

      - name: Install ROS dependencies
        run: |
          if [ "${{ matrix.ros_version }}" = ros1 ]; then
            WS=workspace/src
            EXTRA=--include-eol-distros
          else
            WS=ros2_workspace/src
            EXTRA=
          fi
          docker run --rm -u 0 \
            -v "$GITHUB_WORKSPACE:/opt/sq-kit" \
            ros-ci:${{ matrix.distro }} \
            bash -c "
              rosdep init 2>/dev/null || true
              rosdep update --include-eol-distros
              apt-get update -q
              rosdep install --from-paths /opt/sq-kit/$WS --ignore-src -r -y $EXTRA
            "

      - name: Build (ROS1)
        if: matrix.ros_version == 'ros1'
        run: |
          docker run --rm -u 0 \
            -v "$GITHUB_WORKSPACE:/opt/sq-kit" \
            ros-ci:${{ matrix.distro }} \
            bash -c '
              source /opt/ros/$ROS_DISTRO/setup.bash
              cd /opt/sq-kit/workspace
              catkin init || true
              catkin config --cmake-args -DCMAKE_BUILD_TYPE=RelWithDebInfo
              catkin build
            '

      - name: Build (ROS2)
        if: matrix.ros_version == 'ros2'
        run: |
          docker run --rm -u 0 \
            -v "$GITHUB_WORKSPACE:/opt/sq-kit" \
            ros-ci:${{ matrix.distro }} \
            bash -c '
              source /opt/ros/$ROS_DISTRO/setup.bash
              cd /opt/sq-kit/ros2_workspace
              colcon build
            '

      - name: Test (ROS1)
        if: matrix.ros_version == 'ros1'
        run: |
          docker run --rm -u 0 \
            -v "$GITHUB_WORKSPACE:/opt/sq-kit" \
            ros-ci:${{ matrix.distro }} \
            bash -c '
              source /opt/ros/$ROS_DISTRO/setup.bash
              source /opt/sq-kit/workspace/devel/setup.bash
              export ROS_HOSTNAME=localhost ROS_MASTER_URI=http://localhost:11311
              cd /opt/sq-kit/workspace
              catkin run_tests && catkin_test_results
            '

      - name: Test (ROS2)
        if: matrix.ros_version == 'ros2'
        run: |
          docker run --rm -u 0 \
            -v "$GITHUB_WORKSPACE:/opt/sq-kit" \
            ros-ci:${{ matrix.distro }} \
            bash -c '
              source /opt/ros/$ROS_DISTRO/setup.bash
              source /opt/sq-kit/ros2_workspace/install/setup.bash
              cd /opt/sq-kit/ros2_workspace
              colcon test --event-handlers console_cohesion+ console_direct+
              colcon test-result --verbose
            '
